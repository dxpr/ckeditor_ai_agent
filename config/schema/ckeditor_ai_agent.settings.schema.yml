ckeditor_ai_agent.settings:
  type: config_object
  label: 'CKEditor AI Agent settings'
  mapping:
    key_provider:
      type: string
      label: 'API Key'
    model:
      type: string
      label: 'AI Model'
    ollamaModel:
      type: string
      label: 'Ollama Model'
    endpointUrl:
      type: string
      label: 'Endpoint URL'
    contentScope:
      type: string
      label: 'Content Scope'
    temperature:
      type: float
      label: 'Temperature'
    maxOutputTokens:
      type: integer
      label: 'Max Output Tokens'
    maxInputTokens:
      type: integer
      label: 'Max Input Tokens'
    contextSize:
      type: integer
      label: 'Context Size'
    editorContextRatio:
      type: float
      label: 'Editor Context Ratio'
    timeOutDuration:
      type: integer
      label: 'Timeout Duration'
    retryAttempts:
      type: integer
      label: 'Retry Attempts'
    debugMode:
      type: boolean
      label: 'Debug Mode'
    streamContent:
      type: boolean
      label: 'Stream Content'
    showErrorDuration:
      type: integer
      label: 'Show Error Duration'
    moderationEnable:
      type: boolean
      label: 'Enable Moderation'
    moderationKey:
      type: string
      label: 'Moderation Key'
    promptSettings:
      type: mapping
      label: 'Prompt Settings'
      mapping:
        overrides:
          type: sequence
          label: 'Prompt Overrides'
          sequence:
            type: string
        additions:
          type: sequence
          label: 'Prompt Additions'
          sequence:
            type: string
