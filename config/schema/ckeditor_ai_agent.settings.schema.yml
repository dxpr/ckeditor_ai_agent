ckeditor_ai_agent.settings:
  type: config_object
  label: 'CKEditor AI Agent Settings'
  mapping:
    apiKey:
      type: string
      label: 'API Key'
    engine:
      type: string
      label: 'AI Engine'
    model:
      type: string
      label: 'AI Model'
    endpointUrl:
      type: string
      label: 'Endpoint URL'
    contentScope:
      type: string
      label: 'Content Scope'
    temperature:
      type: float
      label: 'Temperature'
    maxOutputTokens:
      type: integer
      label: 'Max Output Tokens'
    maxInputTokens:
      type: integer
      label: 'Max Input Tokens'
    contextSize:
      type: integer
      label: 'Context Size'
    editorContextRatio:
      type: float
      label: 'Editor Context Ratio'
    timeOutDuration:
      type: integer
      label: 'Timeout Duration'
    retryAttempts:
      type: integer
      label: 'Retry Attempts'
    debugMode:
      type: boolean
      label: 'Debug Mode'
    streamContent:
      type: boolean
      label: 'Stream Content'
    showErrorDuration:
      type: integer
      label: 'Show Error Duration'
    moderationEnable:
      type: boolean
      label: 'Enable Moderation'
    moderationKey:
      type: string
      label: 'Moderation Key'
    promptSettings:
      type: mapping
      label: 'Prompt Settings'
      mapping:
        overrides:
          type: mapping
          label: 'Prompt Component Overrides'
          mapping:
            responseRules:
              type: string
              label: 'Response Rules Override'
            htmlFormatting:
              type: string
              label: 'HTML Formatting Override'
            contentStructure:
              type: string
              label: 'Content Structure Override'
            tone:
              type: string
              label: 'Tone Override'
            inlineContent:
              type: string
              label: 'Inline Content Override'
            imageHandling:
              type: string
              label: 'Image Handling Override'
            referenceGuidelines:
              type: string
              label: 'Reference Guidelines Override'
            contextRequirements:
              type: string
              label: 'Context Requirements Override'
        additions:
          type: mapping
          label: 'Prompt Component Additions'
          mapping:
            responseRules:
              type: string
              label: 'Response Rules Additions'
            htmlFormatting:
              type: string
              label: 'HTML Formatting Additions'
            contentStructure:
              type: string
              label: 'Content Structure Additions'
            tone:
              type: string
              label: 'Tone Additions'
            inlineContent:
              type: string
              label: 'Inline Content Additions'
            imageHandling:
              type: string
              label: 'Image Handling Additions'
            referenceGuidelines:
              type: string
              label: 'Reference Guidelines Additions'
            contextRequirements:
              type: string
              label: 'Context Requirements Additions'
