ckeditor_ai_agent.settings:
  type: config_object
  label: 'CKEditor AI Agent Settings'
  mapping:
    contentScope:
      type: string
      label: 'Content Scope'

    # Tone of Voice Taxonomy Integration
    toneOfVoiceVocabulary:
      type: string
      label: 'Tone of Voice Vocabulary'
    defaultToneOfVoice:
      type: string
      label: 'Default Tone of Voice'
    
    # AI Edit Commands
    commandsVocabulary:
      type: string
      label: 'Commands Vocabulary'

    # Advanced Settings
    temperature:
      type: float
      label: 'Temperature'
    maxOutputTokens:
      type: integer
      label: 'Max Output Tokens'
    maxInputTokens:
      type: integer
      label: 'Max Input Tokens'
    contextSize:
      type: integer
      label: 'Context Size'
    editorContextRatio:
      type: float
      label: 'Editor Context Ratio'

    # Performance Settings
    timeOutDuration:
      type: integer
      label: 'Timeout Duration'
    retryAttempts:
      type: integer
      label: 'Retry Attempts'

    # Behavior Settings
    debugMode:
      type: boolean
      label: 'Debug Mode'
    streamContent:
      type: boolean
      label: 'Stream Content'
    showErrorDuration:
      type: integer
      label: 'Show Error Duration'

    # Moderation Settings
    moderationEnable:
      type: boolean
      label: 'Enable Moderation'
    moderationKey:
      type: string
      label: 'Moderation Key'

    # AI Output Security Settings
    aiOutputSecurity:
      type: mapping
      label: 'AI Output Security'
      mapping:
        allowedDomains:
          type: sequence
          label: 'Allowed Domains'
          sequence:
            type: string

    # Prompt Settings
    promptSettings:
      type: mapping
      label: 'Prompt Settings'
      mapping:
        overrides:
          type: mapping
          label: 'Overrides'
          mapping:
            responseRules:
              type: string
              label: 'Response Rules'
            htmlFormatting:
              type: string
              label: 'HTML Formatting'
            contentStructure:
              type: string
              label: 'Content Structure'
            tone:
              type: string
              label: 'Tone'
            imageHandling:
              type: string
              label: 'Image Handling'
            referenceGuidelines:
              type: string
              label: 'Reference Guidelines'
            contextRequirements:
              type: string
              label: 'Context Requirements'
        additions:
          type: mapping
          label: 'Additions'
          mapping:
            responseRules:
              type: string
              label: 'Response Rules'
            htmlFormatting:
              type: string
              label: 'HTML Formatting'
            contentStructure:
              type: string
              label: 'Content Structure'
            tone:
              type: string
              label: 'Tone'
            imageHandling:
              type: string
              label: 'Image Handling'
            referenceGuidelines:
              type: string
              label: 'Reference Guidelines'
            contextRequirements:
              type: string
              label: 'Context Requirements'
