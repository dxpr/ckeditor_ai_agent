name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubicloud-standard-4
    steps:
      - uses: ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          custom_labels: '{"feat": "feature", "fix": "bug fix", "docs": "documentation", "test": "testing", "ci": "ci", "refactor": "refactor", "perf": "performance", "chore": "maintenance", "revert": "revert"}'
          add_label: 'true'
          add_scope_label: 'true'

  commitlint:
    name: Lint Commit Messages
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          helpURL: https://github.com/dxpr/ckeditor_ai_agent/blob/1.0.x/CONTRIBUTING.md

  drupal-lint:
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Lint Drupal
      run: |
        docker compose --profile lint run drupal-lint

  drupal-check:
    runs-on: ubicloud-standard-4
    steps:
    - uses: actions/checkout@v6

    - name: Drupal Deprecations and Analysis Check
      run: |
        docker compose --profile lint run drupal-check
      env:
        DRUPAL_RECOMMENDED_PROJECT: 11.0.0
